complexity:
  LongMethod:
    active: true
    threshold: 80 #  metodos de maximo n líneas
  LongParameterList:
    active: true
    functionThreshold: 8 # parámetros de una funcion
    constructorThreshold: 5 # inyección  de dependencias
    # Los parámetros con valor por defecto son configuración opcional, no parte de
    # la firma que el consumidor está obligado a conocer. Contarlos inflaba el
    # resultado sobre todo en composables de UI, donde casi todo lo opcional
    # tiene default. Los umbrales de arriba no se tocan.
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 11      # Máximo de funciones permitidas en un archivo
    thresholdInClasses: 11    # Máximo de funciones permitidas dentro de una clase
    thresholdInInterfaces: 11 # Máximo de métodos permitidos en una interfaz

exceptions:
  SwallowedException:
    active: true  # procesar excepciones en bloques catch
  TooGenericExceptionCaught:
    active: true  # capturar errores específicos

style:
  MagicNumber:
    active: false # extraer valores a un archivo de constantes   
  WildcardImport:
    active: false # prohibe importaciones del tipo `import *`
  ReturnCount:
    active: false # Evita tener múltiples puntos de salida (`return`)

naming:
  FunctionNaming:
    active: true  # convención de escritura camelcase de funciones
    ignoreAnnotated: ['Composable']
  VariableNaming:
    active: false # convención de escritura camelcase de variables

empty-blocks:
  EmptyFunctionBlock:
    active: true # Evita callbacks de eventos que se queden vacíos y sin implementar
    # Los overrides vacíos son legitimos: los fakes de test implementan la
    # interfaz sin comportamiento a proposito. La regla apunta a callbacks de
    # eventos sin implementar, no a implementaciones por defecto.
    ignoreOverridden: true
